name: vigie24-prod
services:
  postgres:
    image: postgres:16-alpine
    container_name: vigie24-db-prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres_prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-vigie24_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - vigie24-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vigie24-worker:
    build:
      context: .
      dockerfile: src/Vigie24.Worker/Dockerfile
      target: final
    container_name: vigie24-worker-prod
    env_file: .env.production
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_ENVIRONMENT=Production
      - AiService__Provider=${AI_PROVIDER:-infomaniak}
      - AiService__ApiUrl=${INFOMANIAK_API_URL:-https://api.infomaniak.com}
      - AiService__ApiKey=${INFOMANIAK_API_KEY:-}
      - AiService__Model=${AI_MODEL:-llama-3.1-70b}
      - ConnectionStrings__Database=Host=postgres;Database=${DB_NAME:-vigie24_prod};Username=${DB_USER:-postgres_prod};Password=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vigie24-network
    restart: unless-stopped

  vigie24-web:
    build:
      context: .
      dockerfile: src/Vigie24.Web/Dockerfile
      target: final
    container_name: vigie24-web-prod
    env_file: .env.production
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_ENVIRONMENT=Production
      - Branding__Theme=radar
      - AiService__Provider=${AI_PROVIDER:-infomaniak}
      - AiService__ApiUrl=${INFOMANIAK_API_URL:-https://api.infomaniak.com}
      - AiService__ApiKey=${INFOMANIAK_API_KEY:-}
      - AiService__Model=${AI_MODEL:-llama-3.1-70b}
      - ConnectionStrings__Database=Host=postgres;Database=${DB_NAME:-vigie24_prod};Username=${DB_USER:-postgres_prod};Password=${DB_PASSWORD}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      vigie24-worker:
        condition: service_started
    networks:
      - vigie24-network
    restart: unless-stopped

  # Reverse proxy : HTTPS automatique (Let's Encrypt) si VIGIE24_DOMAIN est un domaine,
  # HTTP simple si c'est une IP. Les WebSockets Blazor sont gérés nativement.
  caddy:
    image: caddy:2-alpine
    container_name: vigie24-caddy-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VIGIE24_DOMAIN=${VIGIE24_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - vigie24-web
    networks:
      - vigie24-network
    restart: unless-stopped

networks:
  vigie24-network:
    driver: bridge

volumes:
  postgres_prod_data:
    name: vigie24_prod_data
  caddy_data:
  caddy_config:
